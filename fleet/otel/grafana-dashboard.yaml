# Grafana dashboard for the orders app. Grafana loads any ConfigMap labeled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-otel-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  orders-otel.json: |
    {
      "uid": "orders-otel",
      "title": "Orders app (OpenTelemetry)",
      "tags": [
        "opentelemetry"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second (auto-instrumented)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count[1m]))",
              "legendFormat": "{{http_route}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency (auto-instrumented)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{http_route}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error % (HTTP 5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))",
              "legendFormat": "errors"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Orders per minute by item (custom metric)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "60 * sum by (item) (rate(orders_placed_total[5m]))",
              "legendFormat": "{{item}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Average order value (custom metric)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(order_value_sum[5m])) / sum(rate(order_value_count[5m]))",
              "legendFormat": "avg order"
            }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Recent traces: click a Trace ID to see every step",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{resource.service.name=\"orders-app\"}",
              "limit": 20,
              "tableType": "traces"
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Slow or failed orders",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{resource.service.name=\"orders-app\" && (duration > 300ms || status = error)}",
              "limit": 20,
              "tableType": "traces"
            }
          ]
        }
      ]
    }
