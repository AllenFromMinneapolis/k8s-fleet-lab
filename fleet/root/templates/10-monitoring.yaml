# Prometheus + Grafana
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.1.0
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheusOperator:
          # v0.95.1 (chart default) only publishes amd64 images; v0.95.2 also has arm64 (Apple silicon).
          image:
            tag: v0.95.2
          prometheusConfigReloader:
            image:
              tag: v0.95.2
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
        prometheus:
          prometheusSpec:
            retention: 6h
            externalLabels:
              cluster: {{ .Values.clusterName }}
              region: {{ .Values.region }}
        grafana:
          adminPassword: fleetlab
          additionalDataSources:
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.otel.svc:3200
  {{- include "fleet.syncPolicy" . | nindent 2 }}
