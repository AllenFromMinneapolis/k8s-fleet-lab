apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-app-code
data:
  app.py: |
{{ .Files.Get "app/app.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-app
  labels:
    app: orders-app
    team: store-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-app
  template:
    metadata:
      labels:
        app: orders-app
        team: store-ops
      annotations:
        checksum/code: {{ .Files.Get "app/app.py" | sha256sum }}
    spec:
      initContainers:
        - name: install-otel
          image: {{ .Values.image }}
          command: [pip, install, --quiet, --no-cache-dir, --target, /deps
            {{- range .Values.packages }}, {{ . }}{{ end }}]
          volumeMounts:
            - name: deps
              mountPath: /deps
      containers:
        - name: app
          image: {{ .Values.image }}
          # The wrapper turns on auto-instrumentation before app.py starts.
          command: [/deps/bin/opentelemetry-instrument, python, /app/app.py]
          env:
            - name: PYTHONPATH
              value: /deps
            - name: OTEL_SERVICE_NAME
              value: orders-app
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=lab,store.cluster={{ .Values.clusterName }},store.region={{ .Values.region }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /menu
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: deps
              mountPath: /deps
            - name: code
              mountPath: /app
      volumes:
        - name: deps
          emptyDir: {}
        - name: code
          configMap:
            name: orders-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: orders-app
spec:
  selector:
    app: orders-app
  ports:
    - port: 8000
      targetPort: 8000
---
# Pretend customers: one order and one menu view every second.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-shopper
  labels:
    app: orders-shopper
    team: store-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-shopper
  template:
    metadata:
      labels:
        app: orders-shopper
        team: store-ops
    spec:
      containers:
        - name: shopper
          image: {{ .Values.shopperImage }}
          command: [sh, -c, "while true; do curl -s -o /dev/null http://orders-app:8000/order; curl -s -o /dev/null http://orders-app:8000/menu; sleep 1; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
