clusterName: store-000
region: none
image: python:3.12-slim
shopperImage: curlimages/curl:8.17.0
# Where the app sends its telemetry: the OpenTelemetry Collector in this cluster.
otlpEndpoint: http://otel-collector.otel.svc:4318
# OpenTelemetry Python packages (installed when the pod starts, so no custom image is needed).
packages:
  - flask==3.1.3
  - opentelemetry-distro==0.66b2
  - opentelemetry-exporter-otlp-proto-http==1.45.2
  - opentelemetry-instrumentation-flask==0.66b2
