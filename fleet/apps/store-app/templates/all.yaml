apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: store-app-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: central-vault
  target:
    name: store-app-secret
  data:
    - secretKey: API_KEY
      remoteRef:
        key: store-app
        property: api_key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: store-app-page
data:
  index.html: |
    <h1>{{ .Values.message }}</h1>
    <p>Cluster: <b>{{ .Values.clusterName }}</b> &nbsp; Region: <b>{{ .Values.region }}</b></p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-app
  labels:
    app: store-app
    team: store-ops
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: store-app
  template:
    metadata:
      labels:
        app: store-app
        team: store-ops
      annotations:
        checksum/page: {{ .Values | toJson | sha256sum }}
    spec:
      containers:
        - name: web
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: store-app-secret
                  key: API_KEY
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: store-app-page
---
apiVersion: v1
kind: Service
metadata:
  name: store-app
spec:
  selector:
    app: store-app
  ports:
    - port: 80
      targetPort: 80
