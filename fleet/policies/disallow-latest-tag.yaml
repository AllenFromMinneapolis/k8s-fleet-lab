apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/description: Images must use a pinned version, never ':latest'.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: no-latest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [store-apps]
      validate:
        message: "Policy: image tag ':latest' (or no tag) is not allowed. Pin a version."
        pattern:
          spec:
            containers:
              - image: "*:* & !*:latest"
